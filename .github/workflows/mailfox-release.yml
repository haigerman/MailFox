# MailFox: Baut eine signierte APK und veröffentlicht sie als GitHub Release
# (Tag vX.Y.Z wird dabei automatisch angelegt) – dort findet Obtainium die Updates.
#
# Auslöser: Änderung der Datei VERSION auf main, oder manuell unter
# Actions → MailFox Release → "Run workflow".
#
# Benötigte Repository-Secrets (wie bei den anderen Apps):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   (alternativ mit Präfix SIGNING_, z. B. SIGNING_KEYSTORE_BASE64)
name: MailFox Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mailfox-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Speicherplatz freigeben
        uses: ./.github/actions/disk-cleanup

      - name: JDK und Gradle einrichten
        uses: ./.github/actions/setup-gradle

      - name: Version aus der Datei VERSION lesen
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "VERSION muss das Format X.Y.Z haben, ist aber '$NAME'" >&2
            exit 1
          fi
          if gh release view "v$NAME" > /dev/null 2>&1; then
            echo "Release v$NAME existiert bereits – bitte VERSION erhöhen." >&2
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Signaturschlüssel bereitstellen
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_KEYSTORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Secret für $name fehlt (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)" >&2
              exit 1
            fi
          done
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Format, das der K-9-Build erwartet (siehe build-plugin/src/main/kotlin/SigningExtensions.kt)
          mkdir -p .signing
          {
            echo "k9.release.storeFile=$RUNNER_TEMP/release.jks"
            echo "k9.release.storePassword=$SIGNING_KEYSTORE_PASSWORD"
            echo "k9.release.keyAlias=$SIGNING_KEY_ALIAS"
            echo "k9.release.keyPassword=$SIGNING_KEY_PASSWORD"
          } > .signing/k9.release.signing.properties

      - name: Signierte APK bauen
        run: |
          ./gradlew :app-k9mail:assembleFossRelease
          cp app-k9mail/build/outputs/apk/foss/release/app-k9mail-foss-release.apk "mailfox.apk"

      - name: Signaturschlüssel entfernen
        if: always()
        run: rm -f .signing/k9.release.signing.properties "$RUNNER_TEMP/release.jks"

      - name: Signatur prüfen
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "mailfox.apk"

      - name: GitHub Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.name }}" \
            "mailfox.apk" \
            --target "$GITHUB_SHA" \
            --title "MailFox ${{ steps.version.outputs.name }}" \
            --generate-notes
